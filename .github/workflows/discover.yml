name: Discover WeChat Official Accounts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run discovery
        run: python -m src.discover

      - name: Commit candidates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'bot: update candidate accounts [skip ci]'
          file_pattern: 'data/* config/*'
          branch: ${{ github.ref_name }}
