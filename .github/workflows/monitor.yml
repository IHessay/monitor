name: Daily WeChat Job Monitor

on:
  schedule:
    - cron: '5 23 * * *'  # 07:05 Beijing Time
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not send notifications or commit state)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          WECOM_WEBHOOK_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python -m src.main

      - name: Commit state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'bot: update state [skip ci]'
          file_pattern: 'data/*'
          branch: ${{ github.ref_name }}
