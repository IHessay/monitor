search:
  # 搜狗微信文章搜索的查询词，用于召回 2027 校园招聘相关公众号文章
  queries:
    - "2027校园招聘"
    - "2027秋招"
    - "2027校招"
    - "2027届招聘"

  # 每个查询词最多翻页数（1-3 为宜，越大越容易被反爬）
  max_pages_per_query: 3

  # 本次运行最多处理的文章数（跨所有查询词合计）
  max_articles_total: 100

  # 是否在没有匹配文章时发送“今日无新岗位”的兜底消息
  send_empty_notice: false

filter:
  law_keywords:
    - 律所
    - 法务
    - 律师
    - 法律
    - 法学生
    - 法学
    - 红圈

  job_keywords:
    - 招聘
    - 实习
    - 暑期
    - 校招
    - 秋招
    - 春招
    - 留用
    - 全职
    - 兼职
    - 助理
    - 授薪

  year_patterns:
    - "2027"
    - "2027届"
    - "27届"

  negative:
    - 培训课
    - 课程
    - 考研
    - 留学中介
    - 广告

wecom:
  # Webhook Key 通过 GitHub Secret WECOM_WEBHOOK_KEY 注入，不要写在这里
  webhook_key: ""

schedule:
  # 北京时间每天 07:05
  cron_utc: "5 23 * * *"
